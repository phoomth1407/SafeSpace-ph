name: Test SafeSpace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run unit and component tests
        run: npm test

      - name: Accessibility audit
        run: npm run lint:a11y

      - name: Production build
        run: npm run build
