name: Deploy SafeSpace to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply home copy
        run: python -c "from pathlib import Path; p=Path('src/lib/i18n.jsx'); s=p.read_text(); old='\"home.subtitle\": \"แอปพลิเคชันที่ช่วยให้เยาวชนไทยเข้าใจสุขภาพจิตของตนเอง ผ่านแบบประเมินอัจฉริยะ พื้นที่แบ่งปัน และสายด่วนที่พึ่งพาได้\",'; new='\"home.subtitle\": \"แอปพลิเคชันที่ช่วยให้เยาวชนไทยเข้าใจสุขภาพจิตของตนเอง พูดคุย และสายด่วนรวมถึงให้ข้อมูลพึ่งพาได้\",'; p.write_text(s.replace(old,new,1))"
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
